  severity: mineur
  note: 'Mode attendu : Création.'
- id: V52-C2
  invariant: V5.2-modes
  garantie: prompt
  applies_to:
  - parchemin
  - atelier
  - forge
  prompt: Je sens qu'il y a un truc entre effort, IA et dignité, aide-moi à trouver.
  conforme:
